<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payslips</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 14px;
}

h2 {
  margin-top: 0;
  margin-bottom: 12px;
}

.group {
  margin-bottom: 16px;
}

.group-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.group-title {
  font-size: 15px;
  font-weight: bold;
}

.group-meta {
  font-size: 12px;
  color: #5c6770;
}

.card {
  background: #fff;
  padding: 14px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.name {
  font-weight: bold;
}

.status {
  font-weight: bold;
}

.status.PAID { color: #2f9e44; }
.status.UNPAID { color: #c92a2a; }

.amount {
  font-size: 14px;
}

.empty {
  color: #5c6770;
  margin: 6px 0 0;
}

a {
  text-decoration: none;
  color: inherit;
}
</style>
</head>

<body>

<h2>Payslips</h2>

<div id="list"></div>

<script>
/* ===== AUTH ===== */
fetch("/api/auth-check", { credentials: "include" })
  .then(r => { if (!r.ok) location.replace("/login.html"); });

/* ===== LOAD LIST ===== */
fetch("/api/daily-labours-list", { credentials: "include" })
  .then(r => r.json())
  .then(rows => {
    const box = document.getElementById("list");
    box.innerHTML = "";

    if (!rows.length) {
      box.innerHTML = "<p>No records</p>";
      return;
    }

    const groups = [
      { key: "UNPAID", title: "Unpaid" },
      { key: "PAID", title: "Paid" }
    ];

    groups.forEach(group => {
      const groupRows = rows.filter(r => (r.status || "").toUpperCase() === group.key);
      const totalAmount = groupRows.reduce((sum, item) => sum + Number(item.amount || 0), 0);

      const section = document.createElement("section");
      section.className = "group";

      const header = document.createElement("div");
      header.className = "group-header";
      header.innerHTML = `
        <div class="group-title">${group.title}</div>
        <div class="group-meta">${groupRows.length} record(s) • RM ${totalAmount.toFixed(2)}</div>
      `;
      section.appendChild(header);

      if (!groupRows.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No records";
        section.appendChild(empty);
      } else {
        groupRows.forEach(r => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <a href="/daily-labour-view.html?id=${r.id}">
              <div class="row">
                <div>
                  <div class="name">${r.worker_name}</div>
                  <div>${r.labour_date}</div>
                </div>
                <div class="status ${r.status}">${r.status}</div>
              </div>
              <div class="amount">RM ${Number(r.amount).toFixed(2)}</div>
            </a>
          `;
          section.appendChild(div);
        });
      }

      box.appendChild(section);
    });
  });
</script>

</body>
</html>
