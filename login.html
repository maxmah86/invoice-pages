<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 16px;
}

h2 {
  text-align: center;
}

.box {
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  max-width: 360px;
  margin: 80px auto;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

label {
  display: block;
  margin-top: 12px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-top: 6px;
  box-sizing: border-box;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  font-size: 16px;
  background: #2c3e50;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.error {
  margin-top: 12px;
  color: #c0392b;
  font-size: 14px;
  text-align: center;
}
</style>
</head>

<body>

<div class="box">
  <h2>MMAC Login</h2>

  <label>Username</label>
  <input id="username" autocomplete="username">

  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password">

  <button onclick="login()">Login</button>

  <div class="error" id="error"></div>
</div>

<script>
async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorBox = document.getElementById("error");

  errorBox.textContent = "";

  if (!username || !password) {
    errorBox.textContent = "Username and password required";
    return;
  }

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      errorBox.textContent = e.error || "Login failed";
      return;
    }

    // 🔑 登录成功后 → 再查一次 auth-check 拿 role
    const auth = await fetch("/api/auth-check", {
      credentials: "include"
    }).then(r => r.json());

    if (!auth.loggedIn) {
      errorBox.textContent = "Session error, please login again";
      return;
    }

    // 转为小写比对，更稳健
    const role = (auth.role || "").toString().trim().toLowerCase();

    // ✅ 修改重点：admin 和 moderator 都进入 /index.html；只有普通 user 去 /work-checklist.html
    if (role === "admin" || role === "moderator") {
      location.replace("/index.html");
    } else {
      location.replace("/work-checklist.html");
    }
  } catch (err) {
    console.error("Login error:", err);
    errorBox.textContent = "Network or server error";
  }
}
</script>

</body>
</html>
