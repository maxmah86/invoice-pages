<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quotation - View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <script src="/js/config.js"></script>
  <script src="/js/company-settings.js"></script>

  <style>
    :root {
      --primary-color: #1a2636;
      --border-color: #000;
      --bg-muted: #f9f9f9;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #333;
      line-height: 1.4;
    }
    /* 控制栏 - 打印时隐藏 */
    .no-print {
      background: #eee;
      padding: 10px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      border-radius: 4px;
    }
    button { padding: 8px 16px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
    .btn-primary { background: var(--primary-color); color: white; border: none; }

    /* 报价单主体布局 */
    .document-wrap {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid #eee;
      padding: 40px;
      background: #fff;
    }

    /* 头部信息 */
    .header { display: flex; justify-content: space-between; margin-bottom: 30px; }
    .company-info h1 { margin: 0; font-size: 24px; color: var(--primary-color); }
    .company-info p { margin: 2px 0; font-size: 13px; }
    .doc-type { text-align: right; }
    .doc-type h2 { margin: 0; font-size: 28px; letter-spacing: 2px; }

    /* 客户与详情 */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 30px;
    }
    .detail-box h3 { font-size: 14px; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 8px; }
    .detail-box p { margin: 3px 0; font-size: 14px; }

    /* 表格样式 */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #f2f2f2; border: 1px solid var(--border-color); padding: 8px; font-size: 13px; }
    td { border: 1px solid var(--border-color); padding: 8px; font-size: 13px; vertical-align: top; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }

    /* 分段标题 */
    .section-header { background: #fcfcfc; font-weight: bold; }
    .section-subtotal { font-style: italic; background: #fafafa; }
    
    /* 总计栏 */
    .grand-total-row { font-weight: bold; font-size: 16px; background: #eee; }

    /* 签名栏 */
    .signature-section { margin-top: 50px; display: flex; justify-content: space-between; }
    .sig-box { width: 200px; border-top: 1px solid #000; text-align: center; padding-top: 5px; margin-top: 80px; font-size: 13px; }

    @media print {
      .no-print { display: none; }
      body { margin: 0; }
      .document-wrap { border: none; width: 100%; max-width: none; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <button onclick="location.href='/index.html'">返回首页</button>
    <button class="btn-primary" onclick="window.print()">打印 / 另存为 PDF</button>
    <button id="convertBtn" style="background:#28a745; color:white; border:none;">转为 Invoice</button>
  </div>

  <div class="document-wrap">
    <div class="header">
      <div class="company-info">
        <img id="company-logo" src="" alt="Logo" style="height: 60px; margin-bottom: 10px;">
        <h1 id="comp-name">Loading...</h1>
        <p id="comp-reg"></p>
        <p id="comp-address"></p>
        <p id="comp-contact"></p>
      </div>
      <div class="doc-type">
        <h2>QUOTATION</h2>
        <p><strong>No:</strong> <span id="q-no">-</span></p>
        <p><strong>Date:</strong> <span id="q-date">-</span></p>
      </div>
    </div>

    <div class="details-grid">
      <div class="detail-box">
        <h3>QUOTATION TO:</h3>
        <p><strong id="q-customer">-</strong></p>
        <p id="q-address">-</p>
      </div>
      <div class="detail-box">
        <h3>PROJECT:</h3>
        <p id="q-project-title">-</p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th width="5%">No.</th>
          <th width="50%">Description</th>
          <th width="10%">UOM</th>
          <th width="10%">Qty</th>
          <th width="12%">Unit Price</th>
          <th width="13%">Amount</th>
        </tr>
      </thead>
      <tbody id="items-tbody">
        </tbody>
      <tfoot>
        <tr class="grand-total-row">
          <td colspan="5" class="text-right">TOTAL AMOUNT (RM)</td>
          <td id="q-grand-total" class="text-right">0.00</td>
        </tr>
      </tfoot>
    </table>

    <div style="margin-top: 20px; font-size: 13px;">
      <p><strong>Terms:</strong> <span id="q-terms">Standard</span></p>
    </div>

    <div class="signature-section">
      <div>
        <div class="sig-box">Issued By</div>
      </div>
      <div>
        <div class="sig-box">Customer Acceptance</div>
      </div>
    </div>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(location.search);
      const qId = params.get('id');
      if (!qId) return alert("Missing Quotation ID");

      function qid(id) { return document.getElementById(id); }

      // 1. 加载公司设置 (来自 company-settings.js)
      if (window.COMPANY_CONFIG) {
        qid('company-logo').src = COMPANY_CONFIG.logoUrl;
        qid('comp-name').textContent = COMPANY_CONFIG.name;
        qid('comp-reg').textContent = COMPANY_CONFIG.regNo;
        qid('comp-address').textContent = COMPANY_CONFIG.address;
        qid('comp-contact').textContent = `Tel: ${COMPANY_CONFIG.phone} | Email: ${COMPANY_CONFIG.email}`;
      }

      // 2. 获取报价单数据
      try {
        const res = await fetch(`/api/quotation-view?id=${qId}`);
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        
        const data = result.data;

        // 填充基础信息
        qid('q-no').textContent = data.quotation_no;
        qid('q-date').textContent = new Date(data.created_at).toLocaleDateString('en-MY');
        qid('q-customer').textContent = data.customer;
        qid('q-address').textContent = data.project_address || '';
        qid('q-project-title').textContent = data.project_title || 'General Works';
        qid('q-grand-total').textContent = Number(data.grand_total).toFixed(2);

        // 填充表格项目
        const tbody = qid('items-tbody');
        tbody.innerHTML = '';
        let itemIdx = 1;

        data.sections.forEach(section => {
          // 渲染分段标题
          if (section.section_title) {
            const secRow = `<tr class="section-header"><td colspan="6">${section.section_title}</td></tr>`;
            tbody.insertAdjacentHTML('beforeend', secRow);
          }

          let sectionTotal = 0;
          section.items.forEach(item => {
            const lineTotal = item.qty * item.unit_price;
            sectionTotal += lineTotal;

            const row = `
              <tr>
                <td class="text-center">${itemIdx++}</td>
                <td>${item.description}</td>
                <td class="text-center">${item.UOM || ''}</td>
                <td class="text-center">${item.qty}</td>
                <td class="text-right">${Number(item.unit_price).toFixed(2)}</td>
                <td class="text-right">${lineTotal.toFixed(2)}</td>
              </tr>
            `;
            tbody.insertAdjacentHTML('beforeend', row);
          });

          // 渲染分段小计 (可选)
          if (data.sections.length > 1) {
            const subRow = `
              <tr class="section-subtotal">
                <td colspan="5" class="text-right">Section Subtotal</td>
                <td class="text-right">${sectionTotal.toFixed(2)}</td>
              </tr>
            `;
            tbody.insertAdjacentHTML('beforeend', subRow);
          }
        });

      } catch (err) {
        console.error(err);
        alert("Failed to load quotation data");
      }

      // 3. 转换发票逻辑
      qid('convertBtn').onclick = async () => {
        if (!confirm("确认将此报价单转换为发票 (Invoice) 吗？")) return;
        
        try {
          // 这里调用你之后需要写的后端 API
          const res = await fetch('/api/convert-to-invoice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quotation_id: qId })
          });
          const resData = await res.json();
          if (resData.success) {
            alert("转换成功！");
            location.href = `/invoice-view.html?id=${resData.invoice_id}`;
          } else {
            alert("转换失败: " + resData.error);
          }
        } catch (e) {
          alert("请求出错");
        }
      };

    })();
  </script>
</body>
</html>
