<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f2f5; }

/* ── Nav ── */
.nav-bar {
  background: #1a2636;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: sticky; top: 0; z-index: 10;
}
.nav-btn {
  padding: 8px 14px; border: none; border-radius: 6px;
  font-size: 13px; font-weight: bold; cursor: pointer; color: #fff;
}
.nav-btn.home { background: #4a5568; }
.nav-btn.new  { background: #27ae60; margin-left: auto; }

/* ── Dashboard ── */
.dashboard {
  background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
  padding: 18px 16px 14px;
}

.dash-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}

.dash-label {
  font-size: 11px;
  color: #90b8d8;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.dash-value {
  font-size: 26px;
  font-weight: bold;
  color: #fff;
}

.dash-sub {
  font-size: 12px;
  color: #90b8d8;
  margin-top: 3px;
}

/* Month filter */
.month-filter {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 14px;
  color: #fff;
  cursor: pointer;
  min-width: 130px;
}

.month-filter option { color: #000; background: #fff; }

.reset-btn {
  padding: 7px 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-weight: bold;
}

/* Stats */
.dash-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.stat-box {
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 10px 12px;
  text-align: center;
}

.stat-box .s-val {
  font-size: 16px;
  font-weight: bold;
  color: #fff;
}

.stat-box .s-lbl {
  font-size: 10px;
  color: #90b8d8;
  text-transform: uppercase;
  margin-top: 3px;
}

/* Search */
.search-bar {
  padding: 10px 12px;
  background: #fff;
}
.search-bar input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
}

/* Chips */
.status-chips {
  padding: 8px 12px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  background: #fff;
}
.chip {
  padding: 5px 13px;
  border-radius: 16px;
  border: 1.5px solid #e2e8f0;
  background: #f8fafc;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}
.chip.active { background: #ebf5ff; border-color: #3b82f6; }

/* List */
.list-wrap { padding: 10px 12px 60px; }
.project-card {
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
}

/* Empty */
.empty-msg {
  text-align: center;
  color: #999;
  padding: 40px;
}
</style>
</head>

<body>

<div class="nav-bar">
  <button class="nav-btn home" onclick="location.href='/index.html'">🏠 Home</button>
  <button class="nav-btn new" onclick="location.href='/project-create.html'">+ New Project</button>
</div>

<div class="dashboard">
  <div class="dash-top">
    <div>
      <div class="dash-label">Total Contract Value</div>
      <div class="dash-value" id="dashTotal">RM 0.00</div>
      <div class="dash-sub" id="dashSub">Loading...</div>
    </div>

    <div style="display:flex; gap:6px;">
      <select class="month-filter" id="monthFilter">
        <option value="">This Year</option>
      </select>

      <button class="reset-btn" onclick="resetFilters()">⟳ Reset</button>
    </div>
  </div>

  <div class="dash-stats">
    <div class="stat-box">
      <div class="s-val" id="statCount">0</div>
      <div class="s-lbl">Projects</div>
    </div>
    <div class="stat-box">
      <div class="s-val" id="statInvoiced">RM 0</div>
      <div class="s-lbl">Invoiced</div>
    </div>
    <div class="stat-box">
      <div class="s-val" id="statCollected">RM 0</div>
      <div class="s-lbl">Collected</div>
    </div>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="searchQ" placeholder="Search...">
</div>

<div class="status-chips">
  <div class="chip active" data-val="">All</div>
  <div class="chip" data-val="ACTIVE">Active</div>
  <div class="chip" data-val="COMPLETED">Completed</div>
  <div class="chip" data-val="ON_HOLD">On Hold</div>
</div>

<div class="list-wrap" id="projectList">
  <div class="empty-msg">Loading...</div>
</div>

<script>
let _statusFilter = "";

function resetFilters() {
  document.getElementById("searchQ").value = "";
  document.getElementById("monthFilter").value = "";
  _statusFilter = "";

  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  document.querySelector('.chip[data-val=""]').classList.add("active");

  load();
}

/* 原本逻辑保持 */
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    _statusFilter = chip.dataset.val;
    load();
  });
});

document.getElementById("monthFilter").onchange = load;
document.getElementById("searchQ").oninput = () => setTimeout(load, 300);

/* 模拟 load（你原本有） */
async function load() {
  document.getElementById("projectList").innerHTML = "<div class='empty-msg'>Reloaded</div>";
}

load();
</script>

</body>
</html>
