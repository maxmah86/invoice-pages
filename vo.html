<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create VO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 14px;
}

h2 {
  margin: 0 0 6px;
}

.subtitle {
  font-size: 14px;
  color: #555;
  margin-bottom: 14px;
}

.card {
  background: #fff;
  padding: 14px;
  border-radius: 8px;
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-top: 10px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

textarea {
  resize: vertical;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  border-bottom: 1px solid #ddd;
  padding: 6px;
}

th {
  background: #f0f0f0;
}

.right {
  text-align: right;
}

.btn {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  margin-top: 10px;
}

.btn-primary {
  background: #2c3e50;
  color: #fff;
}

.btn-add {
  background: #27ae60;
  color: #fff;
}

.btn-cancel {
  background: #7f8c8d;
  color: #fff;
}

.error {
  background: #fee;
  border: 1px solid #e74c3c;
  color: #c0392b;
  padding: 10px;
  border-radius: 6px;
  font-size: 13px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>Create Variation Order</h2>
<div class="subtitle">MMAC Construction</div>

<div id="projectBanner" style="display:none; background:#2c3e50; color:#fff; padding:10px 15px; border-radius:6px; margin-bottom:12px; font-size:14px;">
  📁 Project: <strong id="projectLabel"></strong>
</div>

<div class="card">
  <label>Quotation ID (optional)</label>
  <input id="quotation_id" placeholder="Quotation ID">

  <label>Invoice ID (optional)</label>
  <input id="invoice_id" placeholder="Invoice ID">

  <label>Title</label>
  <input id="title" placeholder="VO title">

  <label>Reason</label>
  <textarea id="reason" rows="3"></textarea>
</div>

<div class="card">
  <label>Items</label>

  <table>
    <thead>
      <tr>
        <th>Description</th>
        <th width="60">Qty</th>
        <th width="90">Price</th>
        <th width="90">Amount</th>
        <th width="40"></th>
      </tr>
    </thead>
    <tbody id="items"></tbody>
  </table>

  <button class="btn btn-add" onclick="addItem()">+ Add Item</button>
</div>

<div class="card">
  <div class="right">Total: RM <strong id="total">0.00</strong></div>
</div>

<div class="card">
  <label>Notes</label>
  <textarea id="notes" rows="3"></textarea>
</div>

<div class="card" id="errorBox" style="display:none;">
  <div class="error" id="errorText"></div>
</div>

<div class="card">
  <button class="btn btn-primary" onclick="submitVO()">Create VO</button>
  <button class="btn btn-cancel" onclick="history.back()">Cancel</button>
</div>

<script>
const tbody = document.getElementById("items");
const totalEl = document.getElementById("total");

/* ===== AUTH CHECK ===== */
fetch("/api/auth-check", { credentials: "include" })
  .then(r => r.json())
  .then(d => { if (!d.loggedIn) location.replace("/login.html"); })
  .catch(() => location.replace("/login.html"));

/* ===== READ PROJECT_ID FROM URL ===== */
const _params    = new URLSearchParams(window.location.search);
const _projectId = _params.get("project_id");

if (_projectId) {
  fetch("/api/project-view?id=" + _projectId, { credentials: "include" })
    .then(r => r.json())
    .then(d => {
      if (d.project) {
        document.getElementById("projectBanner").style.display = "block";
        document.getElementById("projectLabel").textContent =
          d.project.project_name + " (" + d.project.client_name + ")";
      }
    })
    .catch(() => {});
}

function addItem() {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input style="width:100%;box-sizing:border-box;"></td>
    <td><input type="number" value="1" min="1" oninput="calc()"></td>
    <td><input type="number" step="0.01" value="0" oninput="calc()"></td>
    <td class="right">0.00</td>
    <td><button onclick="this.closest('tr').remove();calc()" style="background:#c0392b;color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;">✕</button></td>
  `;
  tbody.appendChild(tr);
}

function calc() {
  let total = 0;
  [...tbody.rows].forEach(r => {
    const qty   = Number(r.cells[1].children[0].value || 0);
    const price = Number(r.cells[2].children[0].value || 0);
    const amt   = qty * price;
    r.cells[3].innerText = amt.toFixed(2);
    total += amt;
  });
  totalEl.innerText = total.toFixed(2);
}

addItem();

async function submitVO() {
  document.getElementById("errorBox").style.display = "none";

  const titleVal  = document.getElementById("title").value.trim();
  const reasonVal = document.getElementById("reason").value.trim();
  const notesVal  = document.getElementById("notes").value.trim();
  const quotId    = document.getElementById("quotation_id").value.trim() || null;
  const invId     = document.getElementById("invoice_id").value.trim() || null;

  if (!titleVal) {
    alert("Please enter a VO title");
    return;
  }

  const items = [...tbody.rows].map(r => ({
    description: r.cells[0].children[0].value.trim(),
    qty:         r.cells[1].children[0].value,
    unit_price:  r.cells[2].children[0].value
  })).filter(i => i.description);

  if (items.length === 0) {
    alert("Please add at least one item with a description");
    return;
  }

  const payload = {
    quotation_id: quotId,
    invoice_id:   invId,
    project_id:   _projectId ? Number(_projectId) : null,
    title:        titleVal,
    reason:       reasonVal,
    notes:        notesVal,
    items
  };

  try {
    const res = await fetch("/api/vo-create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || data.message || res.statusText);
    }

    alert("VO created: " + data.vo_no);
    location.href = _projectId
      ? "/project-view.html?id=" + _projectId
      : "/vos.html";

  } catch (e) {
    document.getElementById("errorBox").style.display = "block";
    document.getElementById("errorText").innerText = e.message || String(e);
  }
}
</script>

</body>
</html>
