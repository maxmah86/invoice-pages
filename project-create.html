<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Create Project</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family: Arial, sans-serif;
margin:20px;
background:#f5f5f5;
}

h2{
margin-bottom:20px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:5px;
font-size:14px;
}

input, select, textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
}

button{
width:100%;
padding:12px;
border:none;
background:#2c7be5;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1a5fd0;
}

</style>

</head>

<body>

<h2>Create Project</h2>

<div class="form-group">
<label>Project Name</label>
<input id="project_name">
</div>

<div class="form-group">
<label>Client Name</label>
<input id="client_name">
</div>

<div class="form-group">
<label>Project Type</label>
<select id="project_type">
<option value="contract">Contract</option>
<option value="direct_job">Direct Job</option>
<option value="repair">Repair</option>
<option value="maintenance">Maintenance</option>
</select>
</div>

<div class="form-group">
<label>Contract Value (RM)</label>
<input id="contract_value" type="number">
</div>

<div class="form-group">
<label>Start Date</label>
<input id="start_date" type="date">
</div>

<div class="form-group">
<label>Notes</label>
<textarea id="notes"></textarea>
</div>

<button onclick="createProject()">Create Project</button>


<script>
// Auth check — admin only
fetch("/api/auth-check", { credentials: "include" })
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => { if (d.role !== "admin") location.replace("/index.html"); })
  .catch(() => location.replace("/login.html"));

async function createProject(){

const data = {

project_name: document.getElementById("project_name").value,
client_name: document.getElementById("client_name").value,
project_type: document.getElementById("project_type").value,
contract_value: document.getElementById("contract_value").value,
start_date: document.getElementById("start_date").value,
notes: document.getElementById("notes").value

};

if (!data.project_name || !data.client_name) {
  alert("Project Name and Client Name are required");
  return;
}

const res = await fetch("/api/project-create",{

method:"POST",
credentials: "include",
headers:{
"Content-Type":"application/json"
},

body: JSON.stringify(data)

});

const result = await res.json();

if(result.success){

alert("Project created");

window.location = "/project-view.html?id=" + result.id;

}else{

alert("Error: " + (result.error || "Failed to create project"));

}

}

</script>

</body>
</html>
