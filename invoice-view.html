<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Invoice View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/config.js"></script>
  <script src="/js/company-settings.js"></script>
  <style>
    /* ... 保留你原来的 CSS 样式 ... */
    :root { --gap: 10px; --font: Arial, sans-serif; --border: #000; --muted-bg: #f0f0f0; --padding: 8px; }
    body { font-family: var(--font); margin: 16px; color: #000; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    .company { font-size: 14px; line-height: 1.5; max-width: 60%; }
    .company-header { display: flex; align-items: flex-start; gap: var(--gap); margin-bottom: 8px; }
    .company-logo { width: 80px; height: auto; flex-shrink: 0; }
    .invoice-box { text-align: right; min-width: 240px; }
    .invoice-title { font-size: 28px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid var(--border); padding: var(--padding); font-size: 13px; }
    th { background: var(--muted-bg); }
    .text-right { text-align: right; }
    .total-row { font-size: 16px; font-weight: bold; text-align: right; margin-top: 15px; }
    #company-chop { width: 120px; margin-bottom: -40px; opacity: 0.9; display: block; margin-left: auto; }
    .signature { margin-top: 40px; display: flex; justify-content: flex-end; }
    @media print { .invoice-actions, button { display: none !important; } }
  </style>
</head>
<body>

  <header class="header">
    <div class="company">
      <div class="company-header">
        <img id="company-logo" src="" alt="Logo" class="company-logo" />
        <div class="company-text">
          <h1 id="comp-name">Loading...</h1>
          <div id="comp-reg" class="ssm-code"></div>
        </div>
      </div>
      <address>
        <div id="comp-address"></div>
        <div id="comp-contact"></div>
      </address>
    </div>

    <div class="invoice-box">
      <div class="invoice-title">INVOICE</div>
      <div class="invoice-actions">
        <button id="homeBtn">HOME</button>
        <button id="printBtn">PRINT</button>
        <button id="editBtn">EDIT</button>
      </div>
      <div class="invoice-meta">
        <div><strong>No:</strong> <span id="invoiceNo">—</span></div>
        <div><strong>Date:</strong> <span id="invoiceDate">—</span></div>
        <div><strong>To:</strong> <span id="customer">—</span></div>
        <div id="statusBadge" style="font-weight:bold; margin-top:5px;"></div>
      </div>
    </div>
  </header>

  <table>
    <thead>
      <tr>
        <th style="width:5%">No</th>
        <th>Description</th>
        <th style="width:10%">Qty</th>
        <th style="width:15%">Unit Price</th>
        <th style="width:15%">Amount (<span class="currency-label">RM</span>)</th>
      </tr>
    </thead>
    <tbody id="items"></tbody>
  </table>

  <div class="total-row">
    TOTAL (<span class="currency-label">RM</span>): <span id="total">0.00</span>
  </div>

  <div class="bank-info" style="margin-top:30px; font-size:13px; border-top:1px solid #eee; padding-top:10px;">
    <strong>Payment Details:</strong><br>
    Bank: <b id="bank-info"></b> | Beneficiary: <b class="comp-name-label"></b><br>
    Cheques payable to: <b class="comp-name-label"></b>
  </div>

  <div class="signature">
    <div style="text-align:center; min-width:200px;">
      <img id="company-chop" src="" alt="Chop" />
      <div style="border-top:1px solid #000; margin-top:40px; padding-top:5px;">
        <strong id="auth-name">Authorized Signature</strong>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const qid = (id) => document.getElementById(id);
      const API_BASE = typeof CONFIG !== 'undefined' ? CONFIG.API_BASE_URL : '/api';
      const params = new URLSearchParams(location.search);
      const id = params.get('id');

      // 1. 初始化公司静态信息 (来自 company-settings.js)
      function setupCompanyUI() {
        if (typeof COMPANY_SETTINGS !== 'undefined') {
          qid('comp-name').textContent = COMPANY_SETTINGS.name;
          qid('comp-reg').textContent = `(Reg No: ${COMPANY_SETTINGS.reg_no})`;
          qid('comp-address').textContent = COMPANY_SETTINGS.address;
          qid('comp-contact').textContent = `Tel: ${COMPANY_SETTINGS.phone} | Email: ${COMPANY_SETTINGS.email}`;
          qid('bank-info').textContent = `${COMPANY_SETTINGS.bank_name} ${COMPANY_SETTINGS.bank_acc}`;
          qid('company-logo').src = COMPANY_SETTINGS.logo_url || '';
          qid('company-chop').src = COMPANY_SETTINGS.chop_url || '';
          document.querySelectorAll('.comp-name-label').forEach(el => el.textContent = COMPANY_SETTINGS.name);
          if (COMPANY_SETTINGS.authorized_name) qid('auth-name').textContent = COMPANY_SETTINGS.authorized_name;
        }
      }

      const formatCurrency = (v) => Number(v || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      // 2. 加载发票动态数据
      async function loadInvoice() {
        if (!id) return qid('items').innerHTML = '<tr><td colspan="5">Invalid ID</td></tr>';

        try {
          const res = await fetch(`${API_BASE}/invoice-view?id=${encodeURIComponent(id)}`);
          if (res.status === 401) return location.replace('/login.html');
          
          const data = await res.json();
          const inv = data.invoice;

          qid('invoiceNo').textContent = inv.invoice_no;
          qid('customer').textContent = inv.customer;
          qid('invoiceDate').textContent = (inv.created_at || '').split(' ')[0];
          
          // 状态处理
          const badge = qid('statusBadge');
          badge.textContent = (inv.status || 'DRAFT').toUpperCase();
          if (typeof CONFIG !== 'undefined' && CONFIG.STATUS_COLORS) {
            badge.style.color = CONFIG.STATUS_COLORS[inv.status.toUpperCase()] || '#000';
          }

          // 核心渲染逻辑：计算总和
          const tbody = qid('items');
          tbody.innerHTML = '';
          let runningTotal = 0;

          if (data.items && data.items.length > 0) {
            data.items.forEach((item, index) => {
              const qty = Number(item.qty || 0);
              const price = Number(item.price || 0);
              const rowAmount = qty * price;
              runningTotal += rowAmount; // 实时累加

              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td style="text-align:center">${index + 1}</td>
                <td>${item.description || ''}</td>
                <td class="text-right">${qty}</td>
                <td class="text-right">${formatCurrency(price)}</td>
                <td class="text-right">${formatCurrency(rowAmount)}</td>
              `;
              tbody.appendChild(tr);
            });
          }

          // 最终显示计算出的总额
          qid('total').textContent = formatCurrency(runningTotal);

          // 导航逻辑
          if (inv.project_id) {
            qid('homeBtn').textContent = '← Project';
            qid('homeBtn').onclick = () => location.href = `/project-view.html?id=${inv.project_id}`;
          }

        } catch (err) {
          console.error(err);
          qid('items').innerHTML = '<tr><td colspan="5" style="color:red">Error loading invoice data.</td></tr>';
        }
      }

      // 事件监听
      qid('printBtn').onclick = () => window.print();
      qid('homeBtn').onclick = () => location.href = '/index.html';
      qid('editBtn').onclick = () => location.href = `/invoice-edit.html?id=${id}`;

      // 执行
      setupCompanyUI();
      loadInvoice();
    })();
  </script>
</body>
</html>
