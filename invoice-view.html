<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Invoice View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/config.js"></script>
  <script src="/js/company-settings.js"></script>
  <style>
    :root {
      --gap: 10px;
      --font: Arial, sans-serif;
      --border: #000;
      --muted-bg: #f5f5f5;
      --padding: 8px;
    }
    body { font-family: var(--font); margin: 20px; color: #000; line-height: 1.4; }

    /* HEADER */
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
    .company { font-size: 14px; line-height: 1.5; max-width: 60%; }
    .company-header { display: flex; align-items: flex-start; gap: var(--gap); margin-bottom: 8px; }
    .company-logo { width: 70px; height: auto; flex-shrink: 0; }
    .company-text h1 { margin: 0; font-size: 24px; font-weight: bold; }
    .ssm-code { font-size: 13px; }

    /* INVOICE INFO */
    .invoice-box { text-align: right; min-width: 250px; }
    .invoice-title { font-size: 32px; font-weight: bold; color: #333; }
    .invoice-actions { margin-bottom: 10px; }
    .invoice-actions button { padding: 6px 12px; font-size: 13px; margin-left: 5px; cursor: pointer; }
    .status-badge { font-weight: bold; font-size: 16px; margin-top: 5px; display: inline-block; }

    /* TABLE STRUCTURE */
    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 15px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 650px; }
    th, td { border: 1px solid var(--border); padding: var(--padding); font-size: 13px; word-wrap: break-word; }
    th { background: var(--muted-bg); font-weight: bold; }
    
    .section-header { background-color: #eee; font-weight: bold; text-align: left; }
    
    .text-right { text-align: right; }
    .text-center { text-align: center; }

    .total-area { font-size: 16px; font-weight: bold; text-align: right; margin-top: 20px; border-top: 2px solid #000; padding-top: 10px; }

    /* SIGNATURE */
    .signature-container { margin-top: 60px; display: flex; justify-content: flex-end; }
    .signature-box { text-align: center; font-size: 13px; min-width: 220px; position: relative; }
    #company-chop { width: 110px; position: absolute; top: -45px; left: 50%; transform: translateX(-50%); opacity: 0.8; pointer-events: none; }

    /* 权限错误 */
    .auth-error { text-align: center; padding: 60px 20px; color: #dc2626; font-size: 18px; max-width: 500px; margin: 0 auto; }
    .auth-error a { color: #2563eb; text-decoration: underline; }

    /* ========== 移动端优化 ========== */
    @media (max-width: 768px) {
      body { margin: 10px; }

      /* 头部：保持左右排列，允许换行 */
      .header {
        flex-wrap: wrap;
        gap: 12px;
      }
      .company {
        max-width: 100%;
        flex: 1 1 60%;
      }
      .invoice-box {
        text-align: right;        /* 保持右对齐 */
        flex: 1 1 35%;
        min-width: 180px;
      }
      .invoice-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 5px;
      }
      .invoice-actions button {
        margin-left: 0;
        padding: 8px 10px;
        font-size: 13px;
      }

      /* 表格滚动 */
      .table-wrapper {
        margin-top: 10px;
      }
      
      /* 描述列允许换行，其他列不换行 */
      td:nth-child(2), th:nth-child(2) {
        white-space: normal;
        word-break: break-word;
        min-width: 180px;
      }
      td, th {
        white-space: nowrap;
      }

      th, td { padding: 8px 6px; }
      .total-area { font-size: 18px; }
    }

    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { margin: 0; zoom: 0.95; }
      .no-print, button, .invoice-actions, #statusBadge { display: none !important; }
      tr { page-break-inside: avoid; }
      .table-wrapper { overflow-x: visible; border: none; }
      table { min-width: 100%; }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="company">
      <div class="company-header">
        <img id="company-logo" src="" alt="Logo" class="company-logo" />
        <div class="company-text">
          <h1 id="comp-name">Loading...</h1>
          <div id="comp-reg" class="ssm-code"></div>
        </div>
      </div>
      <address style="font-style: normal;">
        <div id="comp-address"></div>
        <div id="comp-contact"></div>
      </address>
    </div>

    <div class="invoice-box">
      <div class="invoice-title">INVOICE</div>
      <div class="invoice-actions no-print">
        <button id="homeBtn">HOME</button>
        <button id="printBtn">PRINT / PDF</button>
        <button id="editBtn">EDIT</button>
      </div>
      <div class="invoice-meta">
        <div><strong>No:</strong> <span id="invoiceNo">—</span></div>
        <div><strong>Date:</strong> <span id="invoiceDate">—</span></div>
        <div><strong>To:</strong> <span id="customer">—</span></div>
        <div id="statusBadge" class="status-badge"></div>
      </div>
    </div>
  </header>

  <main>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 40px;">No</th>
            <th>Description</th>
            <th style="width: 70px;" class="text-center">UOM</th>
            <th style="width: 60px;" class="text-center">Qty</th>
            <th style="width: 100px;" class="text-right">Unit Price</th>
            <th style="width: 110px;" class="text-right">Amount (RM)</th>
          </tr>
        </thead>
        <tbody id="itemsList">
          <tr><td colspan="6" class="text-center">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="total-area">
      TOTAL AMOUNT (RM): <span id="totalDisplay">0.00</span>
    </div>
  </main>

  <section class="bank-info" style="margin-top:40px; font-size:13px; border-top: 1px solid #ddd; padding-top: 10px;">
    <strong>Payment Information:</strong><br>
    Bank: <b id="bank-info"></b> | Beneficiary: <b id="beneficiary-name"></b>
    <div style="margin-top: 5px;">
      Payable to: <b id="payable-name"></b>
    </div>
  </section>

  <div class="signature-container">
    <div class="signature-box">
      <img id="company-chop" src="" alt="Chop" />
      <div style="margin-top: 60px; border-top: 1px solid #000; padding-top: 5px;">
        <div>Authorized Signature</div>
        <div><strong id="authorized-name"></strong></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const qid = (id) => document.getElementById(id);
      const urlParams = new URLSearchParams(window.location.search);
      const invoiceId = urlParams.get('id');
      const formatCurrency = (num) => Number(num || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      // 权限检查
      async function checkAdminAuth() {
        try {
          const res = await fetch('/api/auth-check', { credentials: 'include' });
          const data = await res.json();
          if (!data.loggedIn || data.role !== 'admin') {
            showAuthError();
            return false;
          }
          return true;
        } catch (err) {
          console.error('Auth check failed:', err);
          showAuthError('Authentication error. Please try logging in again.');
          return false;
        }
      }

      function showAuthError(message = 'You must be logged in as an administrator to view invoices.') {
        document.body.innerHTML = `
          <div class="auth-error">
            <h2>Access Denied</h2>
            <p>${message}</p>
            <p><a href="/login.html">Go to Login</a></p>
          </div>
        `;
      }

      if (!invoiceId) {
        qid('itemsList').innerHTML = '<tr><td colspan="6" class="text-center" style="color:red">Error: No Invoice ID provided.</td></tr>';
        return;
      }

      qid('printBtn').onclick = () => window.print();
      qid('editBtn').onclick = () => { window.location.href = `/invoice-edit.html?id=${invoiceId}`; };

      async function loadInvoiceData() {
        try {
          const response = await fetch(`/api/invoice-view?id=${encodeURIComponent(invoiceId)}`, { credentials: 'include' });
          const data = await response.json();
          if (!data || !data.success) throw new Error(data.error || 'Failed to fetch data');

          const { invoice, sections, items } = data;

          qid('invoiceNo').textContent = invoice.invoice_no || '—';
          qid('customer').textContent = invoice.customer || '—';
          qid('invoiceDate').textContent = (invoice.created_at || '').split(' ')[0] || '—';
          qid('totalDisplay').textContent = formatCurrency(invoice.amount);

          const status = (invoice.status || "UNPAID").toUpperCase();
          const badge = qid('statusBadge');
          badge.textContent = status;
          badge.style.color = (status === 'UNPAID') ? 'red' : 'green';
          if (status !== 'UNPAID') qid('editBtn').style.display = 'none';

          const tbody = qid('itemsList');
          tbody.innerHTML = '';
          let globalIndex = 1;

          function createItemRow(item, index) {
            const qty = Number(item.qty || 0);
            const price = Number(item.price || 0);
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="text-center">${index}</td>
              <td>${item.description || ''}</td>
              <td class="text-center">${item.UOM || '-'}</td>
              <td class="text-center">${qty}</td>
              <td class="text-right">${formatCurrency(price)}</td>
              <td class="text-right">${formatCurrency(qty * price)}</td>
            `;
            return tr;
          }

          if (sections && sections.length > 0) {
            sections.forEach(sec => {
              const secTr = document.createElement('tr');
              secTr.className = 'section-header';
              secTr.innerHTML = `<td colspan="6" style="background:#f9f9f9; font-weight:bold;">${sec.section_title || 'Section'}</td>`;
              tbody.appendChild(secTr);

              const sectionItems = items.filter(it => it.section_id === sec.id);
              sectionItems.forEach(item => {
                tbody.appendChild(createItemRow(item, globalIndex++));
              });
            });

            const orphanedItems = items.filter(it => !it.section_id);
            if (orphanedItems.length > 0) {
              const otherTr = document.createElement('tr');
              otherTr.innerHTML = `<td colspan="6" style="background:#f9f9f9; font-weight:bold;">Others</td>`;
              tbody.appendChild(otherTr);
              orphanedItems.forEach(item => {
                tbody.appendChild(createItemRow(item, globalIndex++));
              });
            }
          } else {
            if (items && items.length > 0) {
              items.forEach(item => {
                tbody.appendChild(createItemRow(item, globalIndex++));
              });
            } else {
              tbody.innerHTML = '<tr><td colspan="6" class="text-center">No items found</td></tr>';
            }
          }

          qid('homeBtn').onclick = () => {
            window.location.href = invoice.project_id ? `/project-view.html?id=${invoice.project_id}` : '/index.html';
          };

        } catch (err) {
          console.error(err);
          qid('itemsList').innerHTML = `<tr><td colspan="6" class="text-center" style="color:red">Error: ${err.message}</td></tr>`;
        }
      }

      // 补充公司信息填充（兼容 company-settings.js 未覆盖的字段）
      function fillMissingCompanyFields() {
        if (window.COMPANY_CONFIG) {
          // 这些字段 company-settings.js 可能没有设置，我们手动补上
          const beneficiary = document.getElementById('beneficiary-name');
          if (beneficiary) beneficiary.textContent = COMPANY_CONFIG.name;
          
          const payable = document.getElementById('payable-name');
          if (payable) payable.textContent = COMPANY_CONFIG.name;
          
          const authorized = document.getElementById('authorized-name');
          if (authorized) authorized.textContent = COMPANY_CONFIG.name;
        }
      }

      // 页面启动
      document.addEventListener('DOMContentLoaded', async () => {
        const authorized = await checkAdminAuth();
        if (!authorized) return;

        // 先让 company-settings.js 自动填充（它监听 DOMContentLoaded 并执行 applyCompanySettings）
        // 但我们需要等待它执行完毕，这里使用 setTimeout 或微任务确保执行顺序
        await new Promise(resolve => setTimeout(resolve, 0));
        
        // 补充缺失的字段
        fillMissingCompanyFields();
        
        // 加载发票数据
        loadInvoiceData();
      });
    })();
  </script>
</body>
</html>
