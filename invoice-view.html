<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invoice View</title>
  <script src="/js/config.js"></script>
  <script src="/js/company-settings.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; font-size: 13px; }
    .no-print { background: #eee; padding: 10px; margin-bottom: 20px; display: flex; gap: 10px; }
    .doc-wrap { max-width: 800px; margin: 0 auto; border: 1px solid #ddd; padding: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #000; padding: 8px; }
    th { background: #f2f2f2; }
    .text-right { text-align: right; }
    .section-header { background: #f9f9f9; font-weight: bold; }
    .grand-total { background: #eee; font-weight: bold; }
  </style>
</head>
<body>

<div class="no-print">
  <button onclick="location.href='/index.html'">HOME</button>
  <button onclick="window.print()">PRINT PDF</button>
</div>

<div class="doc-wrap">
  <div style="display: flex; justify-content: space-between;">
    <div id="company-side">
      <h1 id="comp-name" style="margin:0"></h1>
      <p id="comp-address" style="margin:5px 0; font-size:12px;"></p>
    </div>
    <div style="text-align: right;">
      <h2 style="margin:0">TAX INVOICE</h2>
      <p>No: <b id="inv-no"></b></p>
      <p>Date: <span id="inv-date"></span></p>
    </div>
  </div>

  <div style="margin-top:20px;">
    <b>BILL TO:</b>
    <p id="inv-customer" style="margin:5px 0; font-weight:bold;"></p>
    <p id="inv-project" style="margin:5px 0; color:#666;"></p>
  </div>

  <table>
    <thead>
      <tr>
        <th width="5%">No</th>
        <th>Description</th>
        <th width="10%">UOM</th>
        <th width="10%">Qty</th>
        <th width="12%">Price</th>
        <th width="15%">Amount</th>
      </tr>
    </thead>
    <tbody id="main-tbody">
      </tbody>
    <tfoot>
      <tr class="grand-total">
        <td colspan="5" class="text-right">GRAND TOTAL (RM)</td>
        <td id="inv-total" class="text-right"></td>
      </tr>
    </tfoot>
  </table>
</div>

<script>
  async function loadInvoice() {
    const id = new URLSearchParams(window.location.search).get('id');
    const qid = (i) => document.getElementById(i);

    // 加载公司信息
    if (window.COMPANY_CONFIG) {
      qid('comp-name').innerText = COMPANY_CONFIG.name;
      qid('comp-address').innerText = COMPANY_CONFIG.address;
    }

    try {
      const res = await fetch(`/api/invoice-view?id=${id}`);
      const data = await res.json();
      if (!data.success) throw new Error(data.error);

      qid('inv-no').innerText = data.invoice.invoice_no;
      qid('inv-date').innerText = new Date(data.invoice.created_at).toLocaleDateString('en-MY');
      qid('inv-customer').innerText = data.invoice.customer;
      qid('inv-project').innerText = data.invoice.project_title || "";
      qid('inv-total').innerText = Number(data.invoice.amount).toFixed(2);

      const tbody = qid('main-tbody');
      tbody.innerHTML = '';
      let rowIdx = 1;

      // 核心渲染逻辑
      data.sections.forEach(sec => {
        // 如果有标题，渲染分段行
        if (sec.section_title) {
          const sTr = document.createElement('tr');
          sTr.className = 'section-header';
          sTr.innerHTML = `<td colspan="6">${sec.section_title}</td>`;
          tbody.appendChild(sTr);
        }

        // 渲染项目
        sec.items.forEach(it => {
          const qty = Number(it.qty) || 0;
          const price = Number(it.price) || 0;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td align="center">${rowIdx++}</td>
            <td>${it.description}</td>
            <td align="center">${it.UOM || '-'}</td>
            <td align="right">${qty}</td>
            <td align="right">${price.toFixed(2)}</td>
            <td align="right">${(qty * price).toFixed(2)}</td>
          `;
          tbody.appendChild(tr);
        });
      });

    } catch (e) {
      alert("加载失败: " + e.message);
    }
  }
  loadInvoice();
</script>
</body>
</html>
