<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tax Invoice - View</title>
  <script src="/js/config.js"></script>
  <script src="/js/company-settings.js"></script>
  <style>
    /* 样式与 quotation-view.html 保持 99% 一致，仅主题色或标题微调 */
    body { font-family: Arial, sans-serif; margin: 20px; font-size: 13px; }
    .no-print { background:#eee; padding:10px; margin-bottom:20px; display:flex; gap:10px; }
    .doc-wrap { max-width: 850px; margin: 0 auto; padding: 30px; border: 1px solid #ddd; }
    .header { display: flex; justify-content: space-between; }
    .doc-title { text-align: right; }
    .doc-title h2 { margin: 0; font-size: 26px; color: #1a2636; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #000; padding: 6px; }
    th { background: #f2f2f2; }
    .text-right { text-align: right; }
    .section-title { background: #f9f9f9; font-weight: bold; }
    .grand-total { font-weight: bold; background: #eee; font-size: 15px; }
    
    .footer-sig { margin-top: 50px; display: flex; justify-content: space-between; }
    .sig-box { width: 200px; border-top: 1px solid #000; text-align: center; margin-top: 60px; }

    @media print { .no-print { display: none; } .doc-wrap { border: none; padding: 0; } }
  </style>
</head>
<body>

<div class="no-print">
  <button onclick="location.href='/index.html'">返回首页</button>
  <button onclick="window.print()">打印发票 (PDF)</button>
</div>

<div class="doc-wrap">
  <div class="header">
    <div class="company">
      <h1 id="comp-name"></h1>
      <p id="comp-info"></p>
    </div>
    <div class="doc-title">
      <h2>TAX INVOICE</h2>
      <p>Invoice No: <b id="inv-no"></b></p>
      <p>Date: <span id="inv-date"></span></p>
    </div>
  </div>

  <div style="margin-top: 20px; display: flex; justify-content: space-between;">
    <div>
      <b>BILL TO:</b>
      <p id="inv-customer"></p>
      <p id="inv-address" style="white-space: pre-wrap;"></p>
    </div>
    <div style="text-align: right;">
      <b>PROJECT:</b>
      <p id="inv-project"></p>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th width="5%">No</th>
        <th>Description</th>
        <th width="10%">UOM</th>
        <th width="10%">Qty</th>
        <th width="12%">Unit Price</th>
        <th width="15%">Amount (RM)</th>
      </tr>
    </thead>
    <tbody id="items-body">
      </tbody>
    <tfoot>
      <tr id="discount-row" style="display:none;">
        <td colspan="5" class="text-right">Discount</td>
        <td id="inv-discount" class="text-right"></td>
      </tr>
      <tr class="grand-total">
        <td colspan="5" class="text-right">GRAND TOTAL (RM)</td>
        <td id="inv-total" class="text-right"></td>
      </tr>
    </tfoot>
  </table>

  <div class="footer-sig">
    <div class="sig-box">Issued By</div>
    <div class="sig-box">Received By</div>
  </div>
</div>

<script>
async function loadInvoice() {
  const id = new URLSearchParams(window.location.search).get('id');
  const res = await fetch(`/api/invoice-view?id=${id}`);
  const { success, invoice, sections } = await res.json();

  if (!success) return alert("加载失败");

  // 1. 公司信息 (来自 company-settings.js)
  document.getElementById('comp-name').textContent = COMPANY_CONFIG.name;
  document.getElementById('comp-info').innerHTML = `${COMPANY_CONFIG.address}<br>Tel: ${COMPANY_CONFIG.phone}`;

  // 2. 发票主表内容
  document.getElementById('inv-no').textContent = invoice.invoice_no;
  document.getElementById('inv-date').textContent = new Date(invoice.created_at).toLocaleDateString('en-MY');
  document.getElementById('inv-customer').textContent = invoice.customer;
  document.getElementById('inv-address').textContent = invoice.project_address;
  document.getElementById('inv-project').textContent = invoice.project_title || '-';
  document.getElementById('inv-total').textContent = Number(invoice.amount).toFixed(2);

  if (invoice.discount > 0) {
    document.getElementById('discount-row').style.display = 'table-row';
    document.getElementById('inv-discount').textContent = `-${Number(invoice.discount).toFixed(2)}`;
  }

  // 3. 渲染分段和项目
  const tbody = document.getElementById('items-body');
  let rowIdx = 1;
  
  sections.forEach(sec => {
    if (sec.section_title) {
      tbody.insertAdjacentHTML('beforeend', `<tr class="section-title"><td colspan="6">${sec.section_title}</td></tr>`);
    }
    sec.items.forEach(it => {
      const amount = it.qty * it.price;
      tbody.insertAdjacentHTML('beforeend', `
        <tr>
          <td class="text-right">${rowIdx++}</td>
          <td>${it.description}</td>
          <td class="text-right">${it.UOM || ''}</td>
          <td class="text-right">${it.qty}</td>
          <td class="text-right">${Number(it.price).toFixed(2)}</td>
          <td class="text-right">${amount.toFixed(2)}</td>
        </tr>
      `);
    });
  });
}

window.onload = loadInvoice;
</script>
</body>
</html>
