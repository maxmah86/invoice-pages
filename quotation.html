<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create / Edit Quotation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:12px;
}
h2 { margin-top:0; }

.box {
  background:#fff;
  padding:14px;
  border-radius:8px;
  margin-bottom:12px;
}

label {
  font-size:14px;
  font-weight:bold;
  display:block;
  margin-top:10px;
}

input, select {
  width:100%;
  padding:12px;
  font-size:16px;
  margin-top:6px;
  box-sizing: border-box; 
  border: 1px solid #ccc;
  border-radius: 4px;
}

.section {
  border:1px solid #e0e0e0;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
  background: #fafafa;
}

.item {
  border-top:1px dashed #ddd;
  padding-top:8px;
  margin-top:8px;
}

.row {
  display:flex;
  gap:6px;
  margin-top: 6px;
}
.row .uom-input { flex: 0.5; }
.row .qty-input { flex: 0.5; }
.row .price-input { flex: 1; }

.subtotal {
  text-align:right;
  font-weight:bold;
  margin-top:8px;
  color: #333;
}

.btn {
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  font-size:15px;
  margin-top:8px;
  cursor: pointer;
}
.btn-add { background:#3498db; color:#fff; }
.btn-save { background:#27ae60; color:#fff; }
.btn-cancel { background:#7f8c8d; color:#fff; }

.total {
  font-size:18px;
  font-weight:bold;
  text-align:right;
  margin-top: 10px;
  color: #2c3e50;
}
</style>
</head>

<body>

<h2 id="pageTitle">Create Quotation</h2>

<div id="projectBanner" style="display:none; background:#2c3e50; color:#fff; padding:10px 15px; border-radius:6px; margin-bottom:12px; font-size:14px;">
  📁 Project: <strong id="projectLabel"></strong>
</div>

<div class="box">
  <label>Customer Name *</label>
  <input type="text" id="customer" placeholder="Enter customer name">

  <label>Project Title</label>
  <input type="text" id="project_title" placeholder="Enter project title">

  <label>Project Address</label>
  <input type="text" id="project_address" placeholder="Enter project address">
</div>

<div class="box">
  <label>Terms & Conditions</label>
  <select id="terms_id">
    <option value="">-- Select Terms --</option>
  </select>
</div>

<div class="box">
  <h3>Sections</h3>
  <div id="sections"></div>
  <button type="button" class="btn btn-add" onclick="addSection()">+ Add New Section</button>
</div>

<div class="box">
  <label>Discount (RM)</label>
  <input type="number" id="discount" value="0" min="0" step="0.01" oninput="calc()">
  <div class="total" id="grandTotal">Total: RM 0.00</div>
</div>

<button type="button" class="btn btn-save" id="saveBtn" onclick="save()">Save Quotation</button>
<button type="button" class="btn btn-cancel" onclick="history.back()">Cancel</button>

<datalist id="catalogs"></datalist>

<script>
const sectionsEl = document.getElementById("sections");

// URL 参数解析
const _params = new URLSearchParams(window.location.search);
const _projectId = _params.get("project_id");
const _quotationId = _params.get("id"); // 用于 Edit 模式

/* ===== 1. 权限检查 ===== */
async function checkAuth() {
  try {
    const r = await fetch("/api/auth-check", { credentials: "include" });
    if (!r.ok) throw new Error("Unauthorized");
    const d = await r.json();
    const role = (d.role || "").toString().trim().toLowerCase();
    
    // 允许 admin 和 moderator
    if (role !== "admin" && role !== "moderator") {
      alert("权限不足：只有管理员或协调员可以创建/编辑 Quotation");
      location.replace("/index.html");
    }
  } catch (err) {
    location.replace("/login.html");
  }
}

/* ===== 2. 初始化数据加载 ===== */
async function init() {
  await checkAuth();
  await Promise.all([loadTerms(), loadCatalogs()]);

  if (_quotationId) {
    document.getElementById("pageTitle").textContent = "Edit Quotation";
    loadQuotationDetails(_quotationId);
  } else if (_projectId) {
    loadProjectDetails(_projectId);
    addSection(); // 默认新增一个 section
  } else {
    addSection(); // 默认新增一个 section
  }
}

/* ===== 载入 Terms ===== */
async function loadTerms() {
  try {
    const r = await fetch("/api/quotation-terms-list", { credentials: "include" });
    const list = await r.json();
    const sel = document.getElementById("terms_id");
    sel.innerHTML = `<option value="">-- Select Terms --</option>`;
    list.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.title;
      sel.appendChild(opt);
    });
  } catch (err) {
    console.error("Load Terms Error:", err);
  }
}

/* ===== 载入 Catalog ===== */
async function loadCatalogs() {
  try {
    const r = await fetch("/api/item-catalog-list", { credentials: "include" });
    const list = await r.json();
    const dl = document.getElementById("catalogs");
    dl.innerHTML = "";
    list
      .filter(i => Number(i.is_active) === 1)
      .forEach(i => {
        const opt = document.createElement("option");
        opt.value = i.description;
        opt.dataset.price = i.default_amount;
        dl.appendChild(opt);
      });
  } catch (err) {
    console.error("Load Catalog Error:", err);
  }
}

/* ===== 载入 Project 信息 (如果从 Project 过来) ===== */
async function loadProjectDetails(pId) {
  try {
    const r = await fetch("/api/project-view?id=" + pId, { credentials: "include" });
    const d = await r.json();
    if (d.project) {
      document.getElementById("projectBanner").style.display = "block";
      document.getElementById("projectLabel").textContent =
        `${d.project.project_name} (${d.project.client_name})`;
      document.getElementById("customer").value = d.project.client_name || "";
      document.getElementById("project_title").value = d.project.project_name || "";
    }
  } catch (err) {
    console.error("Load Project Error:", err);
  }
}

/* ===== DOM 节点操作：添加 Section ===== */
function addSection(title = "") {
  const sec = document.createElement("div");
  sec.className = "section box";
  
  sec.innerHTML = `
    <div style="display:flex; gap:10px;">
        <input placeholder="Section Title (e.g. Living Hall)" value="${title}" style="font-weight:bold; flex:1;">
        <button type="button" class="btn-cancel" style="width:auto; padding:0 10px; margin-top:6px; border-radius:4px;">Remove</button>
    </div>
    <div class="items"></div>
    <button type="button" class="btn btn-add" style="font-size:13px; padding:8px; background:#e2e8f0; color:#333;" onclick="addItem(this)">+ Add Item</button>
    <div class="subtotal">Subtotal: RM <span>0.00</span></div>
  `;

  // 安全地绑定删除 Section 事件，避免层级匹配错乱
  sec.querySelector(".btn-cancel").onclick = () => {
    sec.remove();
    calc();
  };

  sectionsEl.appendChild(sec);

  // 默认新增一条 Item
  addItem(sec.querySelector(".btn-add"));
  return sec;
}

/* ===== DOM 节点操作：添加 Item ===== */
function addItem(btn, itemData = null) {
  const itemsContainer = btn.previousElementSibling;
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `
    <input list="catalogs" placeholder="Item Description" class="desc-input" value="${itemData ? itemData.description : ''}">
    <div class="row">
      <input type="text" placeholder="UOM" class="uom-input" value="${itemData ? itemData.UOM : ''}">
      <input type="number" placeholder="Qty" class="qty-input" value="${itemData ? itemData.qty : 1}">
      <input type="number" placeholder="Price" class="price-input" value="${itemData ? itemData.price : ''}">
    </div>
    <div style="text-align:right; margin-top:4px;">
        <small style="color:#e74c3c; cursor:pointer;" class="btn-remove-item">Remove Item</small>
    </div>
  `;

  div.querySelector(".btn-remove-item").onclick = () => {
    div.remove();
    calc();
  };

  itemsContainer.appendChild(div);

  const desc = div.querySelector(".desc-input");
  const priceInput = div.querySelector(".price-input");

  // 监听输入并匹配 Catalog 价格
  const updatePriceFromCatalog = () => {
    const opt = [...document.querySelectorAll("#catalogs option")]
      .find(o => o.value === desc.value);
    if (opt && opt.dataset.price) {
      priceInput.value = opt.dataset.price;
    }
    calc();
  };

  desc.addEventListener("input", updatePriceFromCatalog);
  div.querySelectorAll("input").forEach(i => i.addEventListener("input", calc));
  
  calc();
}

/* ===== 计算金额 ===== */
function calc() {
  let grand = 0;
  document.querySelectorAll(".section").forEach(sec => {
    let sub = 0;
    sec.querySelectorAll(".item").forEach(it => {
      const qty = Number(it.querySelector(".qty-input").value) || 0;
      const price = Number(it.querySelector(".price-input").value) || 0;
      sub += qty * price;
    });
    const subSpan = sec.querySelector(".subtotal span");
    if (subSpan) subSpan.textContent = sub.toFixed(2);
    grand += sub;
  });

  const discount = Number(document.getElementById("discount").value) || 0;
  const grandTotal = Math.max(0, grand - discount);
  document.getElementById("grandTotal").textContent = `Total: RM ${grandTotal.toFixed(2)}`;
}

/* ===== 保存 Quotation ===== */
async function save() {
  const customer = document.getElementById("customer").value.trim();
  const project_title = document.getElementById("project_title").value.trim();
  const project_address = document.getElementById("project_address").value.trim();
  const terms_id = document.getElementById("terms_id").value || null;
  const discount = Number(document.getElementById("discount").value) || 0;

  if (!customer) {
    alert("Please enter Customer Name");
    return;
  }

  const sections = [];

  document.querySelectorAll(".section").forEach(sec => {
    const sectionTitleInput = sec.querySelector("input");
    const sectionTitle = sectionTitleInput ? sectionTitleInput.value.trim() : "";
    if (!sectionTitle) return;

    const items = [];

    sec.querySelectorAll(".item").forEach(it => {
      const description = it.querySelector(".desc-input").value.trim();
      if (!description) return;

      items.push({
        description,
        UOM: it.querySelector(".uom-input").value.trim(),
        qty: Number(it.querySelector(".qty-input").value) || 0,
        price: Number(it.querySelector(".price-input").value) || 0
      });
    });

    if (items.length > 0) {
      sections.push({
        section_title: sectionTitle,
        items
      });
    }
  });

  if (sections.length === 0) {
    alert("Please add at least one valid section with items");
    return;
  }

  const payload = {
    id: _quotationId ? Number(_quotationId) : undefined, // 编辑模式传 ID
    customer,
    project_id: _projectId ? Number(_projectId) : null,
    project_title,
    project_address,
    terms_id,
    discount,
    sections
  };

  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  try {
    // 根据是否有 _quotationId 判断调用 Create 还是 Update API
    const apiUrl = _quotationId ? "/api/quotation-update" : "/api/quotation-create";
    const res = await fetch(apiUrl, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const json = await res.json();
    if (!json.success) {
      alert("Save failed: " + (json.error || "Unknown error"));
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Quotation";
      return;
    }

    alert("Quotation Saved Successfully!");
    
    // 保存成功后的跳转逻辑
    const targetId = _quotationId || (json.data && json.data.id);
    if (_projectId) {
      location.href = "/project-view.html?id=" + _projectId;
    } else {
      location.href = "/quotation-view.html?id=" + targetId;
    }

  } catch (e) {
    alert("Network error, please try again.");
    saveBtn.disabled = false;
    saveBtn.textContent = "Save Quotation";
  }
}

// 页面加载启动
window.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
